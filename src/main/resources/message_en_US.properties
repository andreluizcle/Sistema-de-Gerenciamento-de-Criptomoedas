help.text=FT-Coin manages FTC virtual coin wallets.\n\n\
Wallet: add, view, edit and delete wallets. Viewing shows the coin balance,\n\
the weighted average cost and the market value.\n\n\
Transactions: record purchases and sales, and quote the coin on any date.\n\
Each transaction uses the quote of the date you enter, taken from the oracle.\n\n\
Reports: wallets ordered by identifier or by holder, the balance of a wallet,\n\
its history, and the gain or loss of each one. Any report can be printed.\n\n\
Gain and loss use weighted average cost: every purchase recalculates the average\n\
cost of the holding, and every sale realizes the difference between the quote of\n\
the day and that average cost.
