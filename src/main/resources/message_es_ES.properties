help.text=FT-Coin administra carteras de moneda virtual FTC.\n\n\
Cartera: añade, consulta, edita y elimina carteras. La consulta muestra el saldo\n\
en moneda, el coste medio ponderado y el valor de mercado.\n\n\
Operaciones: registra compras y ventas y permite cotizar la moneda en cualquier\n\
fecha. Cada operación usa la cotización del día indicado, obtenida del oráculo.\n\n\
Informes: las carteras ordenadas por identificador o por titular, el saldo de una\n\
cartera, su historial y la ganancia o pérdida de cada una. Cualquier informe se\n\
puede imprimir.\n\n\
La ganancia o pérdida se calcula por coste medio ponderado: cada compra recalcula\n\
el coste medio de las existencias y cada venta realiza la diferencia entre la\n\
cotización del día y ese coste medio.
