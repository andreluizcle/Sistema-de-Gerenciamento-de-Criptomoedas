help.text=O FT-Coin administra carteiras de moeda virtual FTC.\n\n\
Carteira: inclui, consulta, edita e exclui carteiras. A consulta mostra o saldo\n\
em moeda, o custo médio ponderado e o valor a mercado.\n\n\
Movimentação: registra compras e vendas e permite cotar a moeda em qualquer data.\n\
A cotação de cada operação é a do dia informado, obtida no oráculo.\n\n\
Relatórios: as carteiras ordenadas por identificador ou por titular, o saldo de\n\
uma carteira, seu histórico e o ganho ou perda de cada uma. Qualquer relatório\n\
pode ser impresso.\n\n\
O ganho ou perda é apurado por custo médio ponderado: cada compra recalcula o\n\
custo médio do estoque e cada venda realiza a diferença entre a cotação do dia e\n\
esse custo médio.
